<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlogSpace — Blog Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="navbar">
    <a class="brand" href="#">BlogSpace</a>
    <div class="nav-actions">
      <span id="userLabel" class="user-label"></span>
      <button id="loginBtn" class="btn ghost">Login</button>
      <button id="registerBtn" class="btn primary">Register</button>
      <button id="logoutBtn" class="btn ghost hidden">Logout</button>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <div>
        <span class="eyebrow">FULL-STACK INTERNSHIP PROJECT</span>
        <h1>Write. Share. Discuss.</h1>
        <p>A clean blogging platform with secure authentication, post management, REST APIs, SQLite persistence and comments.</p>
      </div>
      <button id="newPostBtn" class="btn primary large">+ Create Post</button>
    </section>

    <section id="message" class="message hidden"></section>
    <section id="posts" class="posts-grid"></section>
  </main>

  <dialog id="authDialog">
    <form method="dialog" id="authForm" class="dialog-card">
      <button type="button" class="close" id="authClose">×</button>
      <h2 id="authTitle">Login</h2>
      <div id="nameField" class="field hidden"><label>Name</label><input id="authName" autocomplete="name"></div>
      <div class="field"><label>Email</label><input id="authEmail" type="email" autocomplete="email" required></div>
      <div class="field"><label>Password</label><input id="authPassword" type="password" minlength="6" autocomplete="current-password" required></div>
      <button class="btn primary full" type="submit" id="authSubmit">Login</button>
      <p class="switch" id="authSwitch">Don't have an account? <button type="button" id="switchAuth">Register</button></p>
    </form>
  </dialog>

  <dialog id="postDialog">
    <form method="dialog" id="postForm" class="dialog-card">
      <button type="button" class="close" id="postClose">×</button>
      <h2 id="postDialogTitle">Create Post</h2>
      <input type="hidden" id="postId">
      <div class="field"><label>Title</label><input id="postTitle" maxlength="120" required></div>
      <div class="field"><label>Content</label><textarea id="postContent" rows="9" maxlength="10000" required></textarea></div>
      <button class="btn primary full" type="submit">Save Post</button>
    </form>
  </dialog>

  <dialog id="postViewDialog">
    <div class="dialog-card article-card">
      <button type="button" class="close" id="viewClose">×</button>
      <div id="postView"></div>
    </div>
  </dialog>

  <script src="/js/app.js"></script>
</body>
</html>
